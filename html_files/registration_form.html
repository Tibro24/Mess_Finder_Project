<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
    <link rel="stylesheet" href="../css_files/registration.css">
    <link rel="stylesheet" href="../css_files/nav.css">
</head>

<body>

     
    <div class="form-card">
        <h1 class="form-title">Create an account</h1>
        <p class="form-subtitle">Join MessFinderBD to find or post seats</p>

        <form action="/PUC_project_git/Mess_Finder_Project/php_files/registration.php" method="post">
            <div class="form-group">
                <label for="full_name">Full Name</label>
                <input type="text" id="userName" name="full_name" placeholder="Tibro Shill" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="tibroshill020@gmail.com" required>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" placeholder="01712-345678" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="university">University</label>
                    <input type="text" id="university" name="university" placeholder="BUET, DU..." required>
                </div>
                <div class="form-group">
                    <label for="city">City</label>
                    <input type="text" id="city" name="city" placeholder="Chittagong">
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="•••••••••" required>
            </div>

            <button type="submit" class="submit-btn">Create Account</button>
        </form>

        <p class="form-footer">
            Already have an account? <a href="login.html">log in</a>
        </p>
    </div>
    <script src="/js_files/index.js"></script>
</body>
</html>
